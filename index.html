<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b14">
<title>Змейка</title>
<style>
  :root{
    --bg:#070b14;
    --line:rgba(148,163,184,.16);
    --text:#e6edf7;
    --muted:#8b9bb4;
    --green:#4ade80;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    display:grid;
    place-items:center;
    padding:18px;
    background:
      radial-gradient(900px 500px at 50% -15%, #16294a 0%, transparent 65%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .app{width:min(100%,520px);display:flex;flex-direction:column;gap:14px;}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{
    display:flex;align-items:center;gap:9px;
    font-weight:700;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
  }
  .brand i{
    width:9px;height:9px;border-radius:50%;background:var(--green);
    box-shadow:0 0 12px 2px rgba(74,222,128,.7);
  }
  .stats{display:flex;gap:8px;}
  .stat{
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;
    min-width:76px;padding:7px 12px;border:1px solid var(--line);
    border-radius:12px;background:rgba(255,255,255,.03);
  }
  .stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .stat strong{font-size:18px;line-height:1;font-variant-numeric:tabular-nums;}
  .board{
    position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);background:#0a1120;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  canvas{display:block;width:100%;height:auto;touch-action:none;}
  .overlay{
    position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
    gap:10px;padding:26px;text-align:center;background:rgba(7,11,20,.74);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .overlay[hidden]{display:none;}
  .overlay h1{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:.02em;}
  .overlay p{margin:0;max-width:34ch;color:var(--muted);font-size:14px;line-height:1.5;}
  .btn{
    margin-top:6px;padding:12px 26px;border:0;border-radius:999px;
    font:inherit;font-weight:700;color:#04140c;
    background:linear-gradient(180deg,#7ef2a8,#34d17a);
    box-shadow:0 8px 24px -8px rgba(52,209,122,.9);
    cursor:pointer;transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.07);}
  .btn:active{transform:translateY(1px) scale(.98);}
  .btn:focus-visible{outline:2px solid #a7f3d0;outline-offset:3px;}
  .hint{
    display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;
    font-size:12px;color:var(--muted);
  }
  kbd{
    font:inherit;font-size:11px;padding:2px 6px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;background:rgba(255,255,255,.05);
    color:var(--text);
  }
</style>
</head>
<body>
<main class="app">
  <header class="hud">
    <div class="brand"><i></i>Змейка</div>
    <div class="stats">
      <div class="stat"><span>Счёт</span><strong id="score">0</strong></div>
      <div class="stat"><span>Рекорд</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="board">
    <canvas id="game" width="600" height="600" role="img" aria-label="Игровое поле змейки"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="oTitle">Змейка</h1>
      <p id="oText">Стрелки или WASD — движение. Space — пауза.</p>
      <button class="btn" id="oBtn" type="button">Играть</button>
    </div>
  </div>

  <footer class="hint">
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>WASD</kbd> — движение</span>
    <span><kbd>Space</kbd> — пауза</span>
    <span>Свайп по полю — для телефона</span>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ── Настройки ───────────────────────────────────────────────
  const COLS = 20;
  const ROWS = 20;
  const SIZE = 600;            // внутреннее разрешение canvas
  const CELL = SIZE / COLS;    // 30 px на клетку
  const WRAP = false;          // true — змейка проходит сквозь стены
  const SPEED_BASE = 135;      // мс на шаг в начале
  const SPEED_MIN = 70;        // максимальная скорость
  const SPEED_STEP = 3;        // ускорение за каждое яблоко
  const BEST_KEY = 'snake.best.v1';

  // ── DOM ─────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const oTitle = document.getElementById('oTitle');
  const oText = document.getElementById('oText');
  const oBtn = document.getElementById('oBtn');

  // ── Управление ──────────────────────────────────────────────
  const DIRS = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1,  y: 0 },
    KeyW:       { x: 0,  y: -1 },
    KeyS:       { x: 0,  y: 1 },
    KeyA:       { x: -1, y: 0 },
    KeyD:       { x: 1,  y: 0 }
  };

  // ── Состояние ───────────────────────────────────────────────
  let snake, prevSnake, dir, pending, food, score, best;
  let state = 'ready';               // ready | playing | paused | over
  let acc = 0;
  let lastTime = performance.now();

  try {
    best = Number(localStorage.getItem(BEST_KEY)) || 0;
  } catch (e) {
    best = 0;                     // localStorage недоступен (file://, приватный режим)
  }
  bestEl.textContent = best;

  // ── Раунд ───────────────────────────────────────────────────
  function reset() {
    const cy = ROWS >> 1;
    snake = [{ x: 9, y: cy }, { x: 8, y: cy }, { x: 7, y: cy }, { x: 6, y: cy }];
    prevSnake = [];
    dir = { x: 1, y: 0 };
    pending = [];
    score = 0;
    acc = 0;
    scoreEl.textContent = '0';
    placeFood();
    state = 'ready';
  }

  function placeFood() {
    const busy = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!busy.has(x + ',' + y)) free.push({ x, y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function stepInterval() {
    return Math.max(SPEED_MIN, SPEED_BASE - score * SPEED_STEP);
  }

  function step() {
    if (pending.length) dir = pending.shift();

    const head = snake[0];
    let nx = head.x + dir.x;
    let ny = head.y + dir.y;

    if (WRAP) {
      nx = (nx + COLS) % COLS;
      ny = (ny + ROWS) % ROWS;
    } else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      return gameOver();
    }

    const eating = !!food && nx === food.x && ny === food.y;
    const body = eating ? snake : snake.slice(0, -1);   // хвост успеет уйти
    if (body.some(s => s.x === nx && s.y === ny)) return gameOver();

    prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
    snake.unshift({ x: nx, y: ny });

    if (eating) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* приватный режим */ }
      }
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    acc = 0;
    showOverlay('Игра окончена', 'Счёт: ' + score + ' · Рекорд: ' + best, 'Ещё раз');
  }

  function win() {
    state = 'over';
    acc = 0;
    showOverlay('Победа!', 'Поле заполнено целиком. Счёт: ' + score, 'Ещё раз');
  }

  // ── Экранные состояния ──────────────────────────────────────
  function showOverlay(title, text, button) {
    oTitle.textContent = title;
    oText.textContent = text;
    oBtn.textContent = button;
    overlay.hidden = false;
  }

  function hideOverlay() {
    overlay.hidden = true;
  }

  function start() {
    reset();
    state = 'playing';
    acc = 0;
    lastTime = performance.now();
    hideOverlay();
  }

  function pause() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('Пауза', 'Продолжи, когда будешь готов.', 'Продолжить');
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'playing';
    acc = 0;
    lastTime = performance.now();
    hideOverlay();
  }

  // ── Игровой цикл ────────────────────────────────────────────
  function frame(now) {
    requestAnimationFrame(frame);

    let dt = now - lastTime;
    lastTime = now;
    if (!Number.isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 120);          // вкладка была в фоне — не «телепортируемся»

    if (state === 'playing') {
      acc += dt;
      let guard = 0;
      while (state === 'playing' && acc >= stepInterval() && guard++ < 8) {
        acc -= stepInterval();
        step();
      }
      if (acc > 240) acc = 0;
    }

    render(now);
  }

  // ── Отрисовка ───────────────────────────────────────────────
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // позиция сегмента с плавной интерполяцией между шагами
  function segPos(i, alpha) {
    const s = snake[i];
    const p = prevSnake[i];
    if (!p || alpha >= 1) return s;
    if (Math.abs(p.x - s.x) + Math.abs(p.y - s.y) > 1) return s; // телепорт при WRAP
    return { x: p.x + (s.x - p.x) * alpha, y: p.y + (s.y - p.y) * alpha };
  }

  function render(now) {
    ctx.fillStyle = '#0a1120';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // шахматный фон
    ctx.fillStyle = 'rgba(148,163,184,.045)';
    for (let y = 0; y < ROWS; y++) {
      for (let x = y % 2; x < COLS; x += 2) {
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    drawFood(now);
    drawSnake(now);
  }

  function drawFood(now) {
    if (!food) return;
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const pulse = 0.5 + 0.5 * Math.sin(now / 260);
    const r = CELL * 0.30 + CELL * 0.045 * pulse;

    ctx.save();
    ctx.shadowColor = 'rgba(239,68,68,.85)';
    ctx.shadowBlur = 14 + 8 * pulse;
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.15, cx, cy, r);
    g.addColorStop(0, '#fca5a5');
    g.addColorStop(0.55, '#ef4444');
    g.addColorStop(1, '#b91c1c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // листик
    ctx.save();
    ctx.translate(cx + r * 0.25, cy - r * 0.95);
    ctx.rotate(-0.5);
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.36, r * 0.17, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSnake(now) {
    const alpha = state === 'playing' ? Math.min(1, acc / stepInterval()) : 1;
    const n = snake.length;

    for (let i = n - 1; i >= 0; i--) {
      const p = segPos(i, alpha);
      const f = n > 1 ? i / (n - 1) : 0;
      const pad = 2.6 + f * 1.2;
      const size = CELL - pad * 2;
      const x = p.x * CELL + pad;
      const y = p.y * CELL + pad;

      ctx.fillStyle = 'hsl(' + (152 - 30 * f).toFixed(1) + ', 70%, ' + (62 - 18 * f).toFixed(1) + '%)';
      if (i === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(74,222,128,.65)';
        ctx.shadowBlur = 16;
        roundRect(x, y, size, size, size * 0.34);
        ctx.fill();
        ctx.restore();
      } else {
        roundRect(x, y, size, size, size * 0.34);
        ctx.fill();
      }
    }

    drawEyes(alpha);
  }

  function drawEyes(alpha) {
    const p = segPos(0, alpha);
    const cx = p.x * CELL + CELL / 2;
    const cy = p.y * CELL + CELL / 2;
    const fx = dir.x;
    const fy = dir.y;
    const px = -fy;
    const py = fx;
    const fwd = CELL * 0.15;
    const side = CELL * 0.20;

    for (let s = -1; s <= 1; s += 2) {
      const ex = cx + fx * fwd + px * side * s;
      const ey = cy + fy * fwd + py * side * s;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ex, ey, CELL * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0d1526';
      ctx.beginPath();
      ctx.arc(ex + fx * 1.3, ey + fy * 1.3, CELL * 0.062, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ── Ввод ────────────────────────────────────────────────────
  function turn(nd) {
    const last = pending.length ? pending[pending.length - 1] : dir;
    if (last.x === nd.x && last.y === nd.y) return;        // уже туда
    if (last.x === -nd.x && last.y === -nd.y) return;      // разворот на 180°
    if (pending.length < 2) pending.push(nd);
  }

  window.addEventListener('keydown', (e) => {
    const d = DIRS[e.code];
    if (d) {
      if (state === 'playing') {
        e.preventDefault();
        turn(d);
      } else if (state === 'ready') {
        e.preventDefault();
        start();
        if (!(d.x === -dir.x && d.y === -dir.y)) turn(d);
      }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (state === 'playing') pause();
      else if (state === 'paused') resume();
      else start();
    }
  });

  oBtn.addEventListener('click', () => {
    oBtn.blur();
    if (state === 'paused') resume();
    else start();
  });

  window.addEventListener('blur', () => {
    if (state === 'playing') pause();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pause();
  });

  // свайпы для тача
  let touch = null;

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    touch = null;
    if (Math.hypot(dx, dy) < 24) return;

    const nd = Math.abs(dx) > Math.abs(dy)
      ? { x: Math.sign(dx), y: 0 }
      : { x: 0, y: Math.sign(dy) };

    if (state === 'playing') turn(nd);
    else if (state === 'ready') start();
  }, { passive: true });

  // ── Старт ───────────────────────────────────────────────────
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
